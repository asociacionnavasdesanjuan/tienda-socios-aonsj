<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | Asociación Ornitológica de Navas de San Juan</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <a href="index.html">
            <img src="img/logo.png" alt="Logo Asociación">
        </a>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="tienda.html">Tienda</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <div class="acciones">
        <input
            type="text"
            id="buscador"
            placeholder="Buscar productos..."
        >

        <a href="#" class="carrito">
            🛒 <span id="contadorCarrito">0</span>
        </a>

    </div>

</header>

<section class="hero">

    <div class="hero-contenido">

        <h1>Nuestra Tienda</h1>

        <p>
            Productos oficiales para socios y aficionados a la ornitología.
        </p>

    </div>

</section>

<section>

    <h2>Categorías</h2>

    <div class="grid">

        <div class="card">Anillas</div>
        <div class="card">Jaulas</div>
        <div class="card">Comederos</div>
        <div class="card">Bebederos</div>
        <div class="card">Alimentación</div>
        <div class="card">Accesorios</div>

    </div>

</section>

<section>

    <h2>Productos</h2>

    <div
        id="contenedorProductos"
        class="grid">

        <!-- Aquí aparecerán automáticamente los productos -->

    </div>

</section>

<footer>

    <img
        src="img/logo.png"
        alt="Logo"
        style="max-width:90px;">

    <p>
        Asociación Ornitológica de Navas de San Juan
    </p>

</footer>

<script src="js/productos.js"></script>
<script src="js/carrito.js"></script>
<script src="js/app.js"></script>

</body>
</html>
