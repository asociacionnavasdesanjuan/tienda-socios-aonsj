<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda Oficial del Socio</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f5;
}

header{
background:#0b6b3b;
padding:20px;
text-align:center;
color:white;
}

header img{
width:120px;
}

h1{
margin:10px 0;
}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

padding:30px;

max-width:1200px;

margin:auto;

}

.producto{

background:white;

border-radius:15px;

box-shadow:0 0 15px rgba(0,0,0,.15);

overflow:hidden;

text-align:center;

}

.producto img{

width:100%;

height:200px;

object-fit:cover;

}

.producto h2{

color:#0b6b3b;

}

.precio{

font-size:28px;

font-weight:bold;

color:#0b6b3b;

}

button{

background:#25D366;

color:white;

border:none;

padding:15px 30px;

border-radius:8px;

font-size:18px;

margin:20px;

cursor:pointer;

}

button:hover{

background:#0b6b3b;

}

footer{

background:#111;

color:white;

padding:25px;

text-align:center;

margin-top:40px;

}

</style>

</head>

<body>

<header>

<img src="imagen/logo.png">

<h1>TIENDA DEL SOCIO</h1>

<p>Asociación Ornitológica de Navas de San Juan</p>

</header>

<div class="grid">

<div class="producto">

<img src="https://placehold.co/400x300?text=JAULA">

<h2>Jaula de Cría</h2>

<p class="precio">39,95 €</p>

<button>Añadir al carrito</button>

</div>

<div class="producto">

<img src="https://placehold.co/400x300?text=COMEDERO">

<h2>Comedero</h2>

<p class="precio">2,50 €</p>

<button>Añadir al carrito</button>

</div>

<div class="producto">

<img src="https://placehold.co/400x300?text=BEBEDERO">

<h2>Bebedero</h2>

<p class="precio">1,20 €</p>

<button>Añadir al carrito</button>

</div>

</div>

<footer>

© Asociación Ornitológica de Navas de San Juan

</footer>

</body>
</html>
