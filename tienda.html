<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda del Socio - AONSJ</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f2f5f3;
}

header{
background:#1b5e20;
color:white;
padding:20px;
text-align:center;
position:sticky;
top:0;
}

header h1{
font-size:30px;
}

#buscar{
width:90%;
max-width:500px;
padding:12px;
margin-top:15px;
border-radius:30px;
border:none;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:30px;
}

.card{
background:white;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
overflow:hidden;
text-align:center;
padding-bottom:20px;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
background:#ddd;
}

.card h2{
margin:15px;
color:#1b5e20;
}

.precio{
font-size:24px;
font-weight:bold;
color:#25D366;
margin-bottom:15px;
}

button{
background:#25D366;
color:white;
border:none;
padding:12px 20px;
border-radius:30px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1bb857;
}

#carrito{
position:fixed;
bottom:20px;
right:20px;
background:#1b5e20;
color:white;
padding:15px 25px;
border-radius:40px;
font-size:18px;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,.3);
}
</style>

</head>

<body>

<header>

<h1>🛒 Tienda del Socio</h1>

<p>Asociación Ornitológica de Navas de San Juan</p>

<input id="buscar" placeholder="Buscar productos...">

</header>

<div class="grid">

<div class="card">

<img src="https://placehold.co/600x400?text=Jaula">

<h2>Jaula de Cría</h2>

<div class="precio">Precio pendiente</div>

<button onclick="agregar('Jaula de Cría')">Añadir al carrito</button>

</div>

<div class="card">

<img src="https://placehold.co/600x400?text=Bebedero">

<h2>Bebedero Italiano</h2>

<div class="precio">Precio pendiente</div>

<button onclick="agregar('Bebedero Italiano')">Añadir al carrito</button>

</div>

<div class="card">

<img src="https://placehold.co/600x400?text=Comedero">

<h2>Comedero Exterior</h2>

<div class="precio">Precio pendiente</div>

<button onclick="agregar('Comedero Exterior')">Añadir al carrito</button>

</div>

</div>

<div id="carrito">

🛒 Pedido (0)

</div>

<script>

let pedido=[];

function agregar(producto){

pedido.push(producto);

document.getElementById("carrito").innerHTML="🛒 Pedido ("+pedido.length+")";

}

document.getElementById("carrito").onclick=function(){

if(pedido.length==0){

alert("Todavía no has añadido productos.");

return;

}

let texto="Hola. Soy socio de la Asociación Ornitológica de Navas de San Juan.%0A%0A";

texto+="Quiero solicitar:%0A";

pedido.forEach(p=>{

texto+="• "+p+"%0A";

});

window.open("https://wa.me/34640868527?text="+texto);

}

</script>

</body>

</html>
