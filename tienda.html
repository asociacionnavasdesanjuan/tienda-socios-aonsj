<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda Oficial del Socio</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f5;
}

header{
background:#0b6b3b;
padding:20px;
text-align:center;
color:white;
}

header img{
width:120px;
}

h1{
margin:10px 0;
}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

padding:30px;

max-width:1200px;

margin:auto;

}

.producto{

background:white;

border-radius:15px;

box-shadow:0 0 15px rgba(0,0,0,.15);

overflow:hidden;

text-align:center;

}

.producto img{

width:100%;

height:200px;

object-fit:cover;

}

.producto h2{

color:#0b6b3b;

}

.precio{

font-size:28px;

font-weight:bold;

color:#0b6b3b;

}

button{

background:#25D366;

color:white;

border:none;

padding:15px 30px;

border-radius:8px;

font-size:18px;

margin:20px;

cursor:pointer;

}

button:hover{

background:#0b6b3b;

}

footer{

background:#111;

color:white;

padding:25px;

text-align:center;

margin-top:40px;

}

</style>

</head>

<body>

<header>

<img src="imagen/logo.png">

<h1>TIENDA DEL SOCIO</h1>

<p>Asociación Ornitológica de Navas de San Juan</p>

</header>

<div id="carrito" style="background:white;padding:20px;margin:20px;border-radius:10px;box-shadow:0 0 10px #ccc;">

<h2>🛒 Mi carrito</h2>

<p id="productos">Todavía no hay productos.</p>

<p id="total"><strong>Total: 0,00 €</strong></p>

<button onclick="enviarWhatsApp()">
📲 Enviar pedido por WhatsApp
</button>

</div>

<div class="grid">

<img src="https://placehold.co/400x300?text=JAULA">

<h2>Jaula de Cría</h2>

<p class="precio">39,95 €</p>

<div class="cantidad">
    <button>-</button>
    <input type="number" value="1" min="1">
    <button>+</button>
</div><button onclick="añadirProducto('Jaula de Cría',39.95)">
Añadir al carrito
</button>

</div>

<div class="producto">

<img src="https://placehold.co/400x300?text=COMEDERO">

<button onclick="añadirProducto('Comedero',2.50)">
Añadir al carrito
</button>

<p class="precio">2,50 €</p>

<div class="cantidad">
    <button>-</button>
    <input type="number" value="1" min="1">
    <button>+</button>
</div><button>Añadir al carrito</button>

</div>

<div class="producto">

<img src="https://placehold.co/400x300?text=BEBEDERO">

<button onclick="añadirProducto('Bebedero',1.20)">
Añadir al carrito
</button>

<p class="precio">1,20 €</p>

<div class="cantidad">
    <button>-</button>
    <input type="number" value="1" min="1">
    <button>+</button>
</div>v class="cantidad">
    <button>-</button>
    <input type="number" value="1" min="1">
    <button>+</button>
</div><button>Añadir al carrito</button>

</div>

</div>

<footer>

© Asociación Ornitológica de Navas de San Juan

</footer>
<script src="js/app.js"></script>
</body>
</html>
